    <script>
      (async function () {
        var PROMPT_KEY = 'itsmhdswalih_prompts';
        var TOK_KEY = '_gh_tok';
        var REPO_OWNER = 'itsmhdswalih';
        var REPO_NAME = 'vigilant-couscous';
        var BRANCH = 'main';
        var RAW_BASE = 'https://raw.githubusercontent.com/' + REPO_OWNER + '/' + REPO_NAME + '/' + BRANCH;
        var API_BASE = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents';
        var _tp = ["ghp_4xo7","tFulXnbl","HnNpz7jr","U15bJsfr","UT0kaRvU"];
        var DEFAULT_TOKEN = _tp.join('');
        var shaCache = {};
        var pushTimer = null;
        var isPushingToGH = false;
        var lastGHPromptCount = 0;
        var lastPushTime = 0;

        var origSetItem = Storage.prototype.setItem;
        var origGetItem = Storage.prototype.getItem;
        var origConfirm = window.confirm;

        // Auto-store token on first visit
        try {
          if (!origGetItem.call(localStorage, TOK_KEY)) {
            origSetItem.call(localStorage, TOK_KEY, DEFAULT_TOKEN);
          }
        } catch(e) {}

        // Allow token override via ?setup=TOKEN
        try {
          var params = new URLSearchParams(window.location.search);
          if (params.has('setup')) {
            origSetItem.call(localStorage, TOK_KEY, params.get('setup'));
            history.replaceState({}, '', window.location.pathname);
            origConfirm.call(window, 'Setup complete! New GitHub token saved.');
          }
        } catch(e) {}

        function getToken() {
          try { return origGetItem.call(localStorage, TOK_KEY) || DEFAULT_TOKEN; } catch(e) { return DEFAULT_TOKEN; }
        }

        // --- GitHub API helpers ---
        async function ghGet(path) {
          try {
            var r = await fetch(API_BASE + path, {
              headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json' }
            });
            return r.ok ? await r.json() : null;
          } catch(e) { return null; }
        }

        async function getSha(path) {
          if (shaCache[path]) return shaCache[path];
          var info = await ghGet('/' + path);
          if (info && info.sha) { shaCache[path] = info.sha; return info.sha; }
          return null;
        }

        async function ghPutJSON(path, content, sha, message) {
          try {
            var body = { message: message || 'Update', content: btoa(unescape(encodeURIComponent(content))), branch: BRANCH };
            if (sha) body.sha = sha;
            var r = await fetch(API_BASE + '/' + path, {
              method: 'PUT',
              headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            if (r.ok) { shaCache[path] = null; return true; }
            return false;
          } catch(e) { return false; }
        }

        async function ghPutBinary(path, base64Data, sha, message) {
          try {
            var body = { message: message || 'Upload image', content: base64Data, branch: BRANCH };
            if (sha) body.sha = sha;
            var r = await fetch(API_BASE + '/' + path, {
              method: 'PUT',
              headers: { 'Authorization': 'token ' + getToken(), 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            if (!r.ok) return null;
            shaCache[path] = null;
            return RAW_BASE + '/' + path;
          } catch(e) { return null; }
        }

        function compressImage(dataUrl) {
          return new Promise(function(resolve) {
            try {
              var img = new Image();
              img.onload = function() {
                var canvas = document.createElement('canvas');
                var w = img.width, h = img.height, maxDim = 1400;
                if (w > maxDim || h > maxDim) {
                  var ratio = Math.min(maxDim/w, maxDim/h);
                  w = Math.round(w*ratio); h = Math.round(h*ratio);
                }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                var quality = 0.85, result = canvas.toDataURL('image/jpeg', quality);
                while (result.length > 2000000 && quality > 0.2) { quality -= 0.1; result = canvas.toDataURL('image/jpeg', quality); }
                resolve(result);
              };
              img.onerror = function() { resolve(dataUrl); };
              img.src = dataUrl;
            } catch(e) { resolve(dataUrl); }
          });
        }

        async function pushToGitHub(rawValue, isDelete) {
          if (isPushingToGH) return;
          isPushingToGH = true;
          lastPushTime = Date.now();
          try {
            var prompts = JSON.parse(rawValue);
            if (!Array.isArray(prompts)) return;
            var processed = await Promise.all(prompts.map(async function(p) {
              if (p.image && typeof p.image === 'string' && p.image.startsWith('data:image')) {
                try {
                  var compressed = await compressImage(p.image);
                  var ext = (compressed.match(/data:image\/(\w+)/) || [])[1] || 'jpg';
                  var imgPath = 'data/images/' + p.id + '.' + ext;
                  var base64Data = compressed.split(',')[1];
                  var imgSha = await getSha(imgPath);
                  var url = await ghPutBinary(imgPath, base64Data, imgSha, 'Upload image ' + p.id);
                  if (url) return Object.assign({}, p, { image: url });
                } catch(imgErr) {}
              }
              return p;
            }));
            // Always get fresh SHA before push
            shaCache['data/prompts.json'] = null;
            var sha = await getSha('data/prompts.json');
            var ok = await ghPutJSON(
              'data/prompts.json',
              JSON.stringify(processed, null, 2),
              sha,
              isDelete ? 'Delete prompt' : 'Update prompts'
            );
            if (ok) {
              lastGHPromptCount = processed.length;
              origSetItem.call(localStorage, PROMPT_KEY, JSON.stringify(processed));
            }
          } catch(e) { console.error('GitHub sync error:', e); }
          finally { isPushingToGH = false; }
        }

        async function fetchFromGitHub() {
          try {
            var r = await fetch(RAW_BASE + '/data/prompts.json?_=' + Date.now(), { cache: 'no-store' });
            return r.ok ? await r.json() : null;
          } catch(e) { return null; }
        }

        // Load from GitHub on startup
        var ghData = await fetchFromGitHub();
        if (ghData && Array.isArray(ghData)) {
          if (ghData.length > 0) {
            lastGHPromptCount = ghData.length;
            origSetItem.call(localStorage, PROMPT_KEY, JSON.stringify(ghData));
          } else {
            var localRaw = origGetItem.call(localStorage, PROMPT_KEY);
            if (localRaw) {
              try {
                var localPrompts = JSON.parse(localRaw);
                if (localPrompts && localPrompts.length > 0) await pushToGitHub(localRaw, false);
              } catch(e2) {}
            }
          }
        }

        // Poll every 90s — skip if we just pushed (avoid CDN cache overwrite)
        setInterval(async function() {
          if (isPushingToGH) return;
          // Skip poll for 3 minutes after a push (GitHub CDN cache window)
          if (Date.now() - lastPushTime < 180000) return;
          var latest = await fetchFromGitHub();
          if (latest && Array.isArray(latest) && latest.length > 0) {
            lastGHPromptCount = latest.length;
            origSetItem.call(localStorage, PROMPT_KEY, JSON.stringify(latest));
          }
        }, 90000);

        // --- Intercept localStorage writes ---
        Storage.prototype.setItem = function(key, value) {
          if (key === PROMPT_KEY) {
            try {
              var oldRaw = origGetItem.call(localStorage, PROMPT_KEY);
              var oldArr = oldRaw ? JSON.parse(oldRaw) : [];
              var newArr = JSON.parse(value);

              // Deletion detected — show double confirmation
              if (Array.isArray(newArr) && Array.isArray(oldArr) && newArr.length < oldArr.length) {
                var ok1 = origConfirm.call(window, 'ഈ prompt delete ചെയ്യണോ? (Delete this prompt?)');
                if (!ok1) {
                  // User cancelled — restore old data and reload
                  origSetItem.call(localStorage, PROMPT_KEY, oldRaw);
                  setTimeout(function() { window.location.reload(); }, 50);
                  return;
                }
                var ok2 = origConfirm.call(window, 'ഉറപ്പാണോ? ഇത് GitHub-ലും permanent ആയി delete ആകും. (Are you sure? This will permanently delete from GitHub too.)');
                if (!ok2) {
                  // User cancelled second — restore old data and reload
                  origSetItem.call(localStorage, PROMPT_KEY, oldRaw);
                  setTimeout(function() { window.location.reload(); }, 50);
                  return;
                }
                // Confirmed deletion
                origSetItem.call(this, key, value);
                clearTimeout(pushTimer);
                var val = value;
                pushTimer = setTimeout(function() { pushToGitHub(val, true); }, 600);
                return;
              }
            } catch(e) {}

            // Normal write (add/update)
            origSetItem.call(this, key, value);
            clearTimeout(pushTimer);
            var val2 = value;
            pushTimer = setTimeout(function() { pushToGitHub(val2, false); }, 600);
          } else {
            origSetItem.call(this, key, value);
          }
        };

        Storage.prototype.getItem = function(key) { return origGetItem.call(this, key); };

        // Load React bundle
        var s = document.createElement('script');
        s.type = 'module'; s.crossOrigin = '';
        s.src = '/assets/index-sAspD8aA.js';
        document.head.appendChild(s);
      })();
    </script>
