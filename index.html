    <script>
      (async function () {
        var PROMPT_KEY = 'itsmhdswalih_prompts';
        var DB_NAME = 'itsmhdswalih_images_db';
        var STORE = 'images';
        var imageCache = {};

        function openDB() {
          return new Promise(function (resolve, reject) {
            var req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = function (e) {
              e.target.result.createObjectStore(STORE);
            };
            req.onsuccess = function (e) { resolve(e.target.result); };
            req.onerror = function () { reject(); };
          });
        }

        function dbGetAll(db) {
          return new Promise(function (resolve) {
            try {
              var tx = db.transaction(STORE, 'readonly');
              var store = tx.objectStore(STORE);
              var result = {};
              var req = store.openCursor();
              req.onsuccess = function (e) {
                var cursor = e.target.result;
                if (cursor) {
                  result[cursor.key] = cursor.value;
                  cursor.continue();
                } else {
                  resolve(result);
                }
              };
              req.onerror = function () { resolve({}); };
            } catch (e) { resolve({}); }
          });
        }

        function dbPut(db, key, value) {
          try {
            var tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).put(value, key);
          } catch (e) {}
        }

        function dbDelete(db, key) {
          try {
            var tx = db.transaction(STORE, 'readwrite');
            tx.objectStore(STORE).delete(key);
          } catch (e) {}
        }

        var db;
        try {
          db = await openDB();
          imageCache = await dbGetAll(db);
        } catch (e) {
          db = null;
        }

        var origSetItem = Storage.prototype.setItem;
        var origGetItem = Storage.prototype.getItem;

        if (db) {
          try {
            var existingRaw = origGetItem.call(localStorage, PROMPT_KEY);
            if (existingRaw) {
              var prompts = JSON.parse(existingRaw);
              var rehydrated = prompts.map(function (p) {
                if (p.image === '__img__' && imageCache[p.id]) {
                  return Object.assign({}, p, { image: imageCache[p.id] });
                }
                return p;
              });
              origSetItem.call(localStorage, PROMPT_KEY, JSON.stringify(rehydrated));
            }
          } catch (e) {}

          Storage.prototype.setItem = function (key, value) {
            if (key === PROMPT_KEY) {
              try {
                var prompts = JSON.parse(value);
                var ids = {};
                var toStore = prompts.map(function (p) {
                  ids[p.id] = true;
                  if (p.image && p.image.length > 200) {
                    imageCache[p.id] = p.image;
                    dbPut(db, p.id, p.image);
                    return Object.assign({}, p, { image: '__img__' });
                  }
                  return p;
                });
                Object.keys(imageCache).forEach(function (id) {
                  if (!ids[id]) {
                    dbDelete(db, id);
                    delete imageCache[id];
                  }
                });
                try {
                  origSetItem.call(this, key, JSON.stringify(toStore));
                } catch (e) {}
              } catch (e) {
                try { origSetItem.call(this, key, value); } catch (e2) {}
              }
            } else {
              origSetItem.call(this, key, value);
            }
          };

          Storage.prototype.getItem = function (key) {
            var value = origGetItem.call(this, key);
            if (key === PROMPT_KEY && value) {
              try {
                var prompts = JSON.parse(value);
                return JSON.stringify(prompts.map(function (p) {
                  if (p.image === '__img__' && imageCache[p.id]) {
                    return Object.assign({}, p, { image: imageCache[p.id] });
                  }
                  return p;
                }));
              } catch (e) {}
            }
            return value;
          };
        }

        s.type = 'module';
        s.crossOrigin = '';
